services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.db.bootstrap
    environment:
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      BI_DB_USER: ${BI_DB_USER:-prediccare_bi}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:-change-me-bi}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD}
      DRIFT_PSI_THRESHOLD: ${DRIFT_PSI_THRESHOLD:-0.25}
      DATASET_DIR: ${DATASET_DIR}
      LABELS_DIR: ${LABELS_DIR}
      MODELS_DIR: /app/models
      LOG_LEVEL: ${LOG_LEVEL}
      PSEUDO_HMAC_KEY: ${PSEUDO_HMAC_KEY:-change-me-pseudo}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-change-me-pii}
      AGE_REFERENCE_YEAR: ${AGE_REFERENCE_YEAR:-2026}
      RETENTION_IDENTITES_YEARS: ${RETENTION_IDENTITES_YEARS:-5}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-change-me-demo}
      AUTH_ASSURE_ID: ${AUTH_ASSURE_ID:-}
    volumes:
      - ./CohorteAI_datagen/dataset:/data/dataset:ro
      - ./CohorteAI_datagen/labels:/data/labels:ro
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      PSEUDO_HMAC_KEY: ${PSEUDO_HMAC_KEY:-change-me-pseudo}
      MODELS_DIR: /app/models
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-change-me-pii}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-auth}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-20}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-10}
      RATE_LIMIT_WINDOW_S: ${RATE_LIMIT_WINDOW_S:-60}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      RAG_DIR: ${RAG_DIR:-/corpus}
      ASSISTANT_CACHE_SIMILARITE: ${ASSISTANT_CACHE_SIMILARITE:-0.92}
      N8N_OCR_URL: ${N8N_OCR_URL:-http://n8n:5678/webhook/ocr}
      AGENT_DB_USER: ${AGENT_DB_USER:-prediccare_agent}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-change-me-agent}
      AGENT_STATEMENT_TIMEOUT_MS: ${AGENT_STATEMENT_TIMEOUT_MS:-10000}
    volumes:
      - ./models:/app/models:ro
      - ${RAG_CORPUS_HOST:-./CohorteAI_datagen/rag_corpus}:/corpus
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  superset:
    build:
      context: ./dashboard
    ports:
      - "0.0.0.0:${SUPERSET_PORT:-8088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-superset}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-change-me-superset-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@prediccare.local}
      BI_DB_USER: ${BI_DB_USER:-prediccare_bi}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:-change-me-bi}
      POSTGRES_DB: ${POSTGRES_DB:-prediccare}
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"
    environment:
      API_URL: http://api:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.114.0
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Indian/Antananarivo
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.6
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-llama3.2} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  n8n_data:
  superset_home:
  ollama_data:
